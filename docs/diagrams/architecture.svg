<text x="600.0" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Authorized API request</text>
<text x="600.0" y="266" text-anchor="middle" font-size="14" fill="#40556b">Checks that the request may use this</text>
<text x="600.0" y="284" text-anchor="middle" font-size="14" fill="#40556b">person's field.</text>
</g>
<g data-node="n1_0"><rect x="233.0" y="404" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="390.0" y="416" data-purpose-icon="n1_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2" /><path d="M7 10V7a5 5 0 0 1 10 0v3M12 15v3" /></g></svg>
<text x="408.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">AES-256-GCM</text>
<text x="408.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Encrypts the sensitive value with a fresh</text>
<text x="408.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">data key.</text>
</g>
<g data-node="n1_1"><rect x="617.0" y="404" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="416" data-purpose-icon="n1_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6" /><path d="m12 12 10 10m-4-4 3-3m-6 0 3-3M6 6h.1" /></g></svg>
<text x="792.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Key Vault key</text>
<text x="792.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Protects the small data key using a</text>
<text x="792.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">separately held key.</text>
</g>
<g data-node="n2_0"><rect x="425.0" y="642" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="654" data-purpose-icon="n2_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0" /></g></svg>
<text x="600.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Stored SQL envelope</text>
<text x="600.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Stores the encrypted value and the details</text>
<text x="600.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">needed to read it.</text>
</g>
<g data-node="n3_0"><rect x="425.0" y="880" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="892" data-purpose-icon="n3_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6" /><path d="m12 12 10 10m-4-4 3-3m-6 0 3-3M6 6h.1" /></g></svg>
<text x="600.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Authorized read</text>
<text x="600.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Recovers the data key for an allowed read.</text>
</g>
<g data-node="n4_0"><rect x="425.0" y="1118" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1130" data-purpose-icon="n4_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z" /><path d="m7 12 3 3 7-7" /></g></svg>
<text x="600.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Authenticated decryption</text>
<text x="600.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Checks the value was not altered or moved to</text>
<text x="600.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">another field.</text>
</g>
<g data-node="n5_0"><rect x="425.0" y="1356" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1368" data-purpose-icon="n5_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="1" /><rect x="9" y="9" width="6" height="6" /><path d="M8 1v4m8-4v4M8 19v4m8-4v4M1 8h4m-4 8h4m14-8h4m-4 8h4" /></g></svg>
<text x="600.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Application memory</text>
<text x="600.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Makes the readable value available for the</text>
<text x="600.0" y="1474" text-anchor="middle" font-size="14" fill="#40556b">allowed task.</text>
</g>
