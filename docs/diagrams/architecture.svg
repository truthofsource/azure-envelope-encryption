<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1682" viewBox="0 0 1200 1682" role="img" aria-labelledby="title desc">
<title id="title">Application envelope encryption — illustrated architecture</title>
<desc id="desc">Actual protection of sensitive field values before SQL storage. Key Vault wraps the small data key, not the full record. Historical key versions and authenticated context are recovery dependencies.</desc>
