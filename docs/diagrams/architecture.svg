<text x="54" y="36" font-size="12" font-weight="700" letter-spacing="1.8" fill="#617084">PROJECT ARCHITECTURE · ILLUSTRATED OVERVIEW</text>
<text x="54" y="79" font-size="30" font-weight="700" fill="#172d46">Application envelope encryption</text>
<text x="54" y="110" font-size="16" fill="#526276">Actual protection of sensitive field values before SQL storage</text>
